server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — todas las rutas no encontradas devuelven index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cachear assets con hash (Vite los versiona por nombre en /assets/)
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Archivos estáticos de nombre fijo (íconos, manifest) — sin cache agresivo,
  # porque su contenido puede cambiar sin que cambie el nombre.
  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|webp|avif)$ {
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    try_files $uri =404;
  }

  # HTML siempre fresco
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Health
  location = /health {
    access_log off;
    return 200 "ok";
  }
}
