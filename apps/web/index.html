<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaf9" />
    <script>
      // Sets the theme before first paint so dark mode never flashes light.
      // Same rules as src/lib/theme.ts (key: finance-tdah:theme).
      try {
        var pref = localStorage.getItem('finance-tdah:theme')
      } catch (e) {}
      var dark =
        pref === 'dark' ||
        (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      // Browser chrome color; keep in sync with THEME_COLORS in src/lib/theme.ts.
      var meta = document.querySelector('meta[name="theme-color"]')
      if (meta) meta.setAttribute('content', dark ? '#151412' : '#fafaf9')
    </script>
    <style>
      /* Splash shown until React mounts; colors mirror --color-bg / --color-ink in index.css. */
      html[data-theme='dark'] body { background: #151412; color: #ece9e3; }
      body { margin: 0; background: #fafaf9; color: #1f1e1c; }
      #splash { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; font-family: system-ui, -apple-system, sans-serif; }
      #splash img { width: 72px; height: 72px; border-radius: 18px; }
      #splash span { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; opacity: 0.85; }
    </style>
    <title>Cada Quien</title>
  </head>
  <body>
    <div id="root"><div id="splash"><img src="/pwa-192x192.png" alt="" width="72" height="72" /><span>Cada Quien</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
