name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Same major as production (docker-compose.yml). The integration tests
    # (envelopes, expenses, daily reminder) only run when TEST_DATABASE_URL is
    # set, so this is what makes them count on every PR.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ft_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ft_test

    steps:
      - uses: actions/checkout@v4

      # pnpm's version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The api's migrations (and its Docker image) run on Bun.
      - uses: oven-sh/setup-bun@v2

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Migrate the test database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Test
        run: pnpm test
